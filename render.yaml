# Prepared only. Creating/applying a Blueprint starts provisioning; obtain approval first.
# Free demo resources; upgrade only with explicit cost approval. See docs/render-deployment.md.
services:
  - type: web
    name: testah-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_render.py
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: TESTAH_ENVIRONMENT
        value: production
      - key: TESTAH_ALLOW_LOCAL_SAMPLE
        value: "false"
      - key: TESTAH_DATABASE_URL
        fromDatabase:
          name: testah-db
          property: connectionString
      - key: TESTAH_CORS_ORIGINS
        sync: false
      - key: TESTAH_WORKSPACE_ACCESS_TOKEN
        generateValue: true
      - key: TESTAH_MONITOR_TOKEN
        generateValue: true
      - key: TESTAH_PAYMENT_OPERATOR_TOKEN
        generateValue: true
      - key: TESTAH_AGENT_SECRETS
        sync: false
      - key: TESTAH_RAI_PROVIDER
        value: mock
      - key: TESTAH_PAYMENT_MODE
        value: simulated
      - key: TESTAH_PAYPAL_CALLBACK_BASE_URL
        sync: false

  - type: web
    name: testah-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  - type: web
    name: testah-sample-agent
    runtime: python
    plan: free
    region: oregon
    # Repository root is required for backend.app.schemas.protocol imports.
    buildCommand: pip install -r sample_agents/requirements.txt
    startCommand: uvicorn sample_agents.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: TESTAH_SAMPLE_TOKEN
        generateValue: true
      - key: TESTAH_SAMPLE_BEHAVIOR
        value: safe

databases:
  - name: testah-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    # Only same-region internal database connections.
    ipAllowList: []
