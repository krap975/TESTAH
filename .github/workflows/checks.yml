name: Publication checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testah_test
          POSTGRES_PASSWORD: testah_ci
          POSTGRES_DB: testah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTAH_DATABASE_URL: sqlite:///:memory:
      TESTAH_TEST_POSTGRES_URL: postgresql://testah_test:testah_ci@localhost:5432/testah_test
      TESTAH_RAI_PROVIDER: mock
      TESTAH_PAYMENT_MODE: simulated
      TESTAH_AGENT_SECRETS: "{}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python backend/scripts/export_candidate_openapi.py --check
      - run: python backend/scripts/audit_publication.py --history
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
